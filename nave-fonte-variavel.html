/* ─────────────────────────────────────────────────────────────
   COMPONENTE  .nave
   ───────────────────────────────────────────────────────────── */

/* --p é o "estado" único do logo: 0 = a normal / e expandido,
   1 = a expandido / e normal. Tudo o mais deriva dele. */
@property --p {
  syntax: "<number>";
  inherits: true;
  initial-value: 1;
}

.nave {
  --nave-duration: 2.6s;      /* tempo de ir de um estado ao outro */

  font-family: "Nave Wdth", serif;
  font-weight: 400;
  font-synthesis: none;
  line-height: 1;
  text-rendering: geometricPrecision;   /* posicionamento sub-pixel: largura exata em qualquer quadro */
  white-space: nowrap;
  animation: nave-breathe var(--nave-duration) cubic-bezier(.65, 0, .35, 1) infinite alternate;
}

/* a e e são a MESMA letra em eixos opostos: quando uma abre, a outra fecha.
   A fonte foi desenhada para que  largura(a) + largura(e)  seja sempre a mesma. */
.nave__a { font-variation-settings: "wdth" calc(100 + 75 * var(--p)); }
.nave__e { font-variation-settings: "wdth" calc(100 + 75 * (1 - var(--p))); }

@keyframes nave-breathe {
  from { --p: 1; }
  to   { --p: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .nave { animation: none; }
}

.nave { font-size: clamp(3.5rem, 15vw, 10rem); }
