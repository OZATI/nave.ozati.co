    @property --p {
      syntax: "<number>";
      inherits: true;
      initial-value: 1;
    }

    :root {
      --bg: #000000;
      --border: #222226;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-green: #10b981;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      margin: 0;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      transition: opacity 0.15s ease;
      user-select: none;
      margin-bottom: 32px;
    }
    .brand-lockup:hover {
      opacity: 0.88;
    }
    @keyframes brandLogoSpin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .brand-logo-svg {
      height: 24px;
      width: 24px;
      display: block;
      fill: #ffffff;
      flex-shrink: 0;
      animation: brandLogoSpin 8s linear infinite;
      transform-origin: center center;
    }
    .nave-wordmark-animated {
      --nave-duration: 2.6s;
      font-family: "Nave Wdth", 'BioRhyme', Georgia, serif;
      font-weight: 400;
      font-synthesis: none;
      font-size: 24px;
      line-height: 1;
      letter-spacing: -0.015em;
      color: #ffffff;
      text-rendering: geometricPrecision;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      animation: nave-breathe var(--nave-duration) cubic-bezier(.65, 0, .35, 1) infinite alternate;
    }
    .nave-wordmark-animated .nave__a {
      font-variation-settings: "wdth" calc(100 + 75 * var(--p));
      display: inline-block;
      animation: nave-a-breathe var(--nave-duration) cubic-bezier(.65, 0, .35, 1) infinite;
    }
    .nave-wordmark-animated .nave__e {
      font-variation-settings: "wdth" calc(100 + 75 * (1 - var(--p)));
      display: inline-block;
      animation: nave-e-breathe var(--nave-duration) cubic-bezier(.65, 0, .35, 1) infinite;
    }
    @keyframes nave-breathe {
      from { --p: 1; }
      to   { --p: 0; }
    }
    @keyframes nave-a-breathe {
      0%, 100% { font-variation-settings: "wdth" 175; }
      50%      { font-variation-settings: "wdth" 100; }
    }
    @keyframes nave-e-breathe {
      0%, 100% { font-variation-settings: "wdth" 100; }
      50%      { font-variation-settings: "wdth" 175; }
    }
    .brand-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { color: var(--text-muted); max-width: 500px; margin-bottom: 28px; font-size: 15px; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-main { background: #fff; color: #000; }
    .btn-sec { background: transparent; border: 1px solid var(--border); color: var(--text); }
